services:
  # Backend API Web Service
  - type: web
    name: allocflow-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: allocflow-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true

  # Frontend Next.js Web Service
  - type: web
    name: allocflow-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: allocflow-backend
          property: host
          path: /api/v1

databases:
  - name: allocflow-db
    plan: free
    region: oregon
    databaseName: allocflow_db
    user: postgres
